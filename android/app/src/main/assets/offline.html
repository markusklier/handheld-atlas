<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handheld Atlas</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0d0c; color: #e8efe9; font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: 12px; background: #8ff0b5; color: #0a2617; font-weight: 650; text-decoration: none; }
  p { color: #a9b8ae; }
</style></head>
<body><main>
  <h1>Keine Verbindung</h1>
  <p>Atlas braucht beim ersten Start eine Internetverbindung. Danach öffnet er auch offline den zuletzt geladenen Stand.</p>
  <a id="retry" href="https://markusklier.github.io/handheld-atlas/">Erneut versuchen</a>
</main>
<script>
  // keep the role (?screen=…) the app asked for
  var q = location.hash.slice(1);
  if (q) document.getElementById('retry').href += '?' + q;
</script></body></html>
