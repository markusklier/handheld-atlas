<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101316">
<meta name="description" content="Handheld Atlas: Spielwege, Mods und Community-Projekte entdecken. Ein Thor-first Discovery-Prototyp mit offenem Katalog.">
<meta name="referrer" content="no-referrer">
<title>Handheld Atlas - Mehr aus deinem Handheld.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>/*__STYLE__*/</style>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt</a>
<div id="app">
<aside class="sidebar">
<a href="#discover" class="brand" aria-label="Atlas Startseite"><span class="brandmark">A<span></span></span><span>ATLAS<small>HANDHELD DISCOVERY</small></span></a>
<div class="nav-caption">DEIN SPIEL. DEINE M&Ouml;GLICHKEITEN.</div>
<nav aria-label="Hauptnavigation" id="nav"></nav>
<div class="sidebar-bottom">
<div class="device-card"><div class="eyebrow">DEIN PLATTFORMPROFIL</div><label class="sr-only" for="device">Plattformprofil w&auml;hlen</label><select id="device"></select><p>Manuell gew&auml;hlt. Kein Ger&auml;tescan und keine Leistungsgarantie.</p></div>
<button id="install" class="quiet full" type="button">Als App nutzen <span aria-hidden="true">&#8599;</span></button>
<div class="version">OPEN CATALOG <span>v0.5</span></div>
</div>
</aside>
<div class="workspace">
<header class="topbar">
<div class="search-wrap"><span aria-hidden="true" id="search-icon"></span><label for="search" class="sr-only">Spiele, Franchises oder Projekte suchen</label><input id="search" type="search" placeholder="Spiel, Franchise, Spielversion suchen ..." autocomplete="off"><kbd>/</kbd></div>
<button type="button" class="top-button" data-nav="watchlist" title="Merkliste" aria-label="Merkliste"><span id="bookmark-icon"></span><span id="watch-count">0</span></button>
<span class="local-badge"><span></span> Lokal &amp; ohne Konto</span>
</header>
<main id="main" tabindex="-1"></main>
<footer class="page-footer"><span>Von Spielen aus denken. Nicht von Emulatoren.</span><button type="button" data-nav="sources">Quellen &amp; Grenzen des Katalogs &#8599;</button></footer>
</div>
</div>
<dialog id="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="info-dialog" aria-labelledby="info-title"><div id="info-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript><div class="noscript">Atlas ben&ouml;tigt JavaScript. Der Katalog liegt zus&auml;tzlich als lesbare Datei unter data/catalog.json vor.</div></noscript>
<script id="catalog-data" type="application/json">/*__CATALOG__*/</script>
<script id="updates-data" type="application/json">/*__UPDATES__*/</script>
<script id="candidates-data" type="application/json">/*__CANDIDATES__*/</script>
<script id="research-data" type="application/json">/*__RESEARCH__*/</script>
<script id="projects-data" type="application/json">/*__PROJECTS__*/</script>
<script id="quality-data" type="application/json">/*__QUALITY__*/</script>
<script id="media-data" type="application/json">/*__MEDIA__*/</script>
<script id="platform-paths-data" type="application/json">/*__PLATFORM_PATHS__*/</script>
<script id="addons-data" type="application/json">/*__ADDONS__*/</script>
<script id="project-checks-data" type="application/json">/*__PROJECT_CHECKS__*/</script>
<script>/*__CORE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
