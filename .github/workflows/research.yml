name: KI-Recherche
# OpenAI (Websuche) recherchiert Fassungen, Spielwege, Mods und Erfahrungsberichte und schreibt sie direkt in data/.
# Start: Knopf "Run workflow" mit Spiel-ID · neues Issue mit Label "recherche" (Button in der App) · wöchentlich.
# Braucht das Repository-Secret OPENAI_API_KEY; optional die Variable OPENAI_MODEL.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Was soll laufen?'
        type: choice
        default: recherche
        options: [recherche, dualscreen, warteschlange, bilder, bildpruefung]
      game:
        description: 'Spiel-ID, z. B. grand-theft-auto-san-andreas (leer = automatisch; bei „bilder“: Bilder genau dieses Spiels)'
        required: false
        type: string
      version:
        description: 'Optional: Fassung (id) als Schwerpunkt, z. B. xbox'
        required: false
        type: string
      new_game:
        description: 'Neues Spiel aufnehmen (Titel), z. B. No Man''s Sky'
        required: false
        type: string
      franchise:
        description: 'Reihe erfassen: fehlende Spiele anlegen, z. B. Tomb Raider'
        required: false
        type: string
      count:
        description: 'Anzahl: Spiele (recherche ohne ID) bzw. Spielwege (bilder)'
        required: false
        default: '3'
        type: string
  issues:
    types: [opened, reopened]  # reopen a closed request issue to run it again
  schedule:
    - cron: '43 18 * * 3'      # weekly: 3 games + screenshots + image check
    - cron: '17 19 * * 0'      # weekly: dual-screen scan
    - cron: '23 */2 * * *'     # every 2 h: work through the research queue (no cost when empty)
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: research-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  research:
    # public repo: only the owner/collaborators can trigger research via issues (and paste in-app results)
    if: >-
      github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'recherche') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main          # always the latest data, not the commit that triggered the (possibly queued) run
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: libretro-thumbnails-Listen aus dem Cache
        uses: actions/cache@v4
        with:
          path: .cache/libretro
          key: libretro-${{ github.run_id }}
          restore-keys: libretro-
      - name: Schon erledigt?
        id: guard
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        # an issue created with a label fires "opened" AND "labeled"; the second run finds it closed and stops
        run: |
          state=$(gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json state --jq .state)
          echo "skip=$([ "$state" = "CLOSED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Recherche
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GAME: ${{ inputs.game }}
          VERSION: ${{ inputs.version }}
          NEW_GAME: ${{ inputs.new_game }}
          FRANCHISE: ${{ inputs.franchise }}
          COUNT: ${{ inputs.count || '3' }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RESEARCH_REPORT: ${{ runner.temp }}/report.md
          GITHUB_TOKEN: ${{ github.token }}   # README/release images (media.py)
        run: |
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "bildpruefung" ]; then
            echo "Nur Bildprüfung."
          elif [ "$MODE" = "bilder" ] && [ -n "$GAME" ]; then
            python scripts/ai_research.py --images "$GAME"
          elif [ "$MODE" = "bilder" ]; then
            python scripts/ai_research.py --screenshots "${COUNT:-15}"
          elif [ "$MODE" = "dualscreen" ] || [ "${{ github.event.schedule }}" = "17 19 * * 0" ]; then
            python scripts/ai_research.py --dual-scan
          elif [ "$MODE" = "warteschlange" ] || [ "${{ github.event.schedule }}" = "23 */2 * * *" ]; then
            python scripts/ai_research.py --queue "${COUNT:-3}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/ai_research.py --batch 3 --screenshots 10
          elif [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/ai_research.py --issue-body "$ISSUE_BODY" --issue-title "$ISSUE_TITLE"
          elif [ -n "$GAME" ]; then
            python scripts/ai_research.py --game "$GAME" ${VERSION:+--version "$VERSION"}
          elif [ -n "$NEW_GAME" ]; then
            python scripts/ai_research.py --new-game "$NEW_GAME"
          elif [ -n "$FRANCHISE" ]; then
            python scripts/ai_research.py --franchise "$FRANCHISE"
          else
            python scripts/ai_research.py --batch "$COUNT"
          fi
      - name: KI-Bildprüfung neuer Screenshots
        if: steps.guard.outputs.skip != 'true' && github.event.schedule != '23 */2 * * *'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/ai_vision.py --limit 40
      - run: python scripts/franchises.py --fix && python scripts/atlas.py repair && python scripts/atlas.py format && python scripts/atlas.py validate
      - id: commit
        run: |
          git config user.name "atlas-ki-recherche"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/push.sh "data: KI-Recherche $(date -u +%F)"
      - name: Ergebnis im Issue melden
        if: github.event_name == 'issues' && always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="${{ runner.temp }}/report.md"
          [ -f "$report" ] || echo "Die Recherche ist fehlgeschlagen oder es ist kein OPENAI_API_KEY hinterlegt." > "$report"
          printf '%s\n\n%s\n' "KI-Recherche abgeschlossen. Neue Einträge sind als *KI-Fund, ungeprüft* markiert und erscheinen nach dem Deploy in der App." "$(cat "$report")" > "${{ runner.temp }}/comment.md"
          gh issue comment ${{ github.event.issue.number }} --body-file "${{ runner.temp }}/comment.md"
          if [ "${{ steps.commit.outcome }}" = "success" ]; then gh issue close ${{ github.event.issue.number }}; fi
  deploy:
    needs: research
    if: needs.research.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
