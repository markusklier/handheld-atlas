name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check app/app.js && node --check app/setup.js && node --check app/dual.js && node --check app/sw.js
      - run: python scripts/atlas.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/atlas.py build
