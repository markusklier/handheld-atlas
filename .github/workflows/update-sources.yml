name: Automated Atlas discovery
on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional game ID for a focused scan (e.g. minecraft); otherwise rotate across all titles'
        required: false
        type: string
      run_ai:
        description: 'Use OpenAI web-research and vision (requires OPENAI_API_KEY, may cost money)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * *'    # daily deterministic source checks
    - cron: '23 8 * * 6'    # weekly deeper discovery, AI only with explicitly configured secret
permissions:
  contents: write
concurrency:
  group: atlas-discovery-main
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Watch known GitHub sources (no executable downloads)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_sources.py
      - name: Detect new repositories across games
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 8 * * 6'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/discover_repositories.py
      - name: Search game-specific GitHub and Modrinth leads
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 8 * * 6'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          if [ -n "$GAME_ID" ]; then
            python scripts/deep_research.py --game "$GAME_ID" --live --budget 6
          else
            python scripts/deep_research.py --batch 4 --live --budget 4
          fi
      - name: Optional AI web research (1 game only)
        continue-on-error: true
        if: (github.event_name == 'workflow_dispatch' && inputs.run_ai) || github.event.schedule == '23 8 * * 6'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_RESEARCH_MODEL: ${{ vars.ATLAS_RESEARCH_MODEL || 'gpt-5.4' }}
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          if [ -n "$GAME_ID" ]; then
            python scripts/ai_agents.py --research --game "$GAME_ID"
          else
            python scripts/ai_agents.py --research
          fi
      - name: Optional Vision candidate checks (at most 2 images)
        continue-on-error: true
        if: (github.event_name == 'workflow_dispatch' && inputs.run_ai) || github.event.schedule == '23 8 * * 6'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_VISION_MODEL: ${{ vars.ATLAS_VISION_MODEL || 'gpt-5.5' }}
        run: python scripts/ai_agents.py --vision --max-images 2
      - name: Build auto-visible source-linked project graph
        run: |
          python scripts/atlas_v4.py
          python scripts/triage_media.py
          python scripts/quality_audit.py
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/core.test.cjs
          python scripts/build.py
      - name: Save static preview for private testing
        uses: actions/upload-artifact@v4
        with:
          name: handheld-atlas-preview
          path: dist/
          retention-days: 7
      - name: Auto-publish data only (never commit third-party executable files)
        shell: bash
        run: |
          git config user.name 'Atlas data automation'
          git config user.email 'atlas-data-automation@users.noreply.github.com'
          git add data/updates.json data/candidates.json data/research_queue.json data/media_candidates.json data/media_review.json data/quality_report.json data/projects.json data/ai_findings.json data/vision_reviews.json
          if git diff --cached --quiet; then
            echo 'No data changed'; exit 0
          fi
          git commit -m 'data: refresh automatically discovered sources and leads'
          git push origin HEAD:main
