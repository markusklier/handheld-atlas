name: Watcher
# Daily, no AI: new releases of known projects, new candidates (GitHub, forks, Modrinth, Reddit),
# missing covers and screenshots (libretro-thumbnails, project READMEs, Steam, Wikipedia). Commits straight to main and redeploys the app.
on:
  schedule:
    - cron: '16 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Watch projects and discover candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/watch.py
      - name: libretro-thumbnails listings from cache
        uses: actions/cache@v4
        with:
          path: .cache/libretro
          key: libretro-${{ github.run_id }}
          restore-keys: libretro-
      - name: Fill missing covers (libretro-thumbnails)
        continue-on-error: true
        run: python scripts/covers.py
      - name: Screenshots per way to play (project READMEs), Steam and Wikipedia covers
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/media.py
      - name: Community reports from EmuReady (devices with the AYN Thor's chip)
        continue-on-error: true
        env:
          EMUREADY_API_KEY: ${{ secrets.EMUREADY_API_KEY }}
        run: python scripts/emuready.py --limit 25
      - name: Keep franchises consistent, drop invalid URLs
        run: python scripts/franchises.py --fix && python scripts/atlas.py repair
      - run: python scripts/atlas.py validate
      - id: commit
        run: |
          git config user.name "atlas-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/push.sh "data: Watcher $(date -u +%F)"
  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
