name: Watcher
# Daily, no AI: new releases of known projects, new candidates (GitHub, forks, Modrinth, Reddit),
# missing covers and screenshots (libretro-thumbnails, project READMEs, Steam, Wikipedia). Commits straight to main and redeploys the app.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Watch projects and discover candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/watch.py
      - name: Fill missing covers (libretro-thumbnails)
        continue-on-error: true
        run: python scripts/covers.py
      - name: Screenshots per way to play (project READMEs), Steam and Wikipedia covers
        continue-on-error: true
        run: python scripts/media.py
      - name: Community reports from EmuReady (devices with the AYN Thor's chip)
        continue-on-error: true
        env:
          EMUREADY_API_KEY: ${{ secrets.EMUREADY_API_KEY }}
        run: python scripts/emuready.py --limit 25
      - name: Keep franchises consistent, drop invalid URLs
        run: python scripts/franchises.py --fix && python scripts/atlas.py repair
      - run: python scripts/atlas.py validate
      - id: commit
        run: |
          if git diff --quiet data; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "atlas-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: Watcher $(date -u +%F)"
          # the maintenance agent may have pushed meanwhile; on a conflict skip today, tomorrow's run catches up
          git pull --rebase origin main || { git rebase --abort; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
