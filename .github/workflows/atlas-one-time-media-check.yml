name: Atlas one-time media source check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-one-time-media-check.yml'
permissions:
  contents: write
concurrency:
  group: atlas-discovery-main
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Search Minecraft project sources (free API calls only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/deep_research.py --game minecraft --live --budget 6
      - name: Enrich image galleries from original sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/enrich_media.py --game minecraft --limit 10
      - name: Rebuild game-project graph and check validity
        run: |
          python scripts/atlas_v4.py
          python scripts/triage_media.py
          python scripts/quality_audit.py
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py
      - name: Save refreshed source evidence only
        shell: bash
        run: |
          git config user.name 'Atlas data automation'
          git config user.email 'atlas-data-automation@users.noreply.github.com'
          git add data/research_queue.json data/projects.json data/media_review.json data/quality_report.json
          if git diff --cached --quiet; then
            echo 'No new media or project data'; exit 0
          fi
          git commit -m 'data: discover source-linked Minecraft image candidates'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
