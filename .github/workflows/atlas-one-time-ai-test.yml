name: Atlas one-time AI + Vision smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-one-time-ai-test.yml'
permissions:
  contents: write
concurrency:
  group: atlas-discovery-main
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: One Minecraft web research call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_RESEARCH_MODEL: ${{ vars.ATLAS_RESEARCH_MODEL || 'gpt-6.1-sol' }}
        run: python scripts/ai_agents.py --research --game minecraft
      - name: Up to two image plausibility checks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_VISION_MODEL: ${{ vars.ATLAS_VISION_MODEL || 'gpt-6.1-terra' }}
        run: python scripts/ai_agents.py --vision --game minecraft --max-images 2
      - name: Validate and build result
        run: |
          python scripts/atlas_v4.py
          python scripts/triage_media.py
          python scripts/quality_audit.py
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/core.test.cjs
          python scripts/build.py
      - name: Save private preview
        uses: actions/upload-artifact@v4
        with:
          name: handheld-atlas-ai-smoke-preview
          path: dist/
          retention-days: 7
      - name: Save AI findings and image verdicts
        shell: bash
        run: |
          git config user.name 'Atlas data automation'
          git config user.email 'atlas-data-automation@users.noreply.github.com'
          git add data/ai_findings.json data/vision_reviews.json data/projects.json
          if git diff --cached --quiet; then
            echo 'No new data was produced'
            exit 0
          fi
          git commit -m 'data: AI and Vision smoke test findings'
          git push origin HEAD:main
