name: Enrich game covers and original screenshots
on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional exact game ID; leave empty for next games without covers'
        required: false
        type: string
      provider:
        description: 'Metadata provider'
        required: true
        default: 'steam'
        type: choice
        options: [steam, igdb]
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-game-media.yml'
  schedule:
    - cron: '41 9 * * 3'
permissions:
  contents: write
concurrency:
  group: atlas-discovery-main
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Read exact-matched, source-linked game artwork
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GAME_ID: ${{ inputs.game_id }}
          PROVIDER: ${{ inputs.provider || 'steam' }}
        shell: bash
        run: |
          if [ -n "$GAME_ID" ]; then
            python scripts/enrich_game_media.py --live --provider "$PROVIDER" --game "$GAME_ID" --limit 1
          else
            python scripts/enrich_game_media.py --live --provider "$PROVIDER" --limit 18
          fi
      - name: Validate source and code
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/core.test.cjs
          python scripts/build.py
      - name: Store only metadata and rebuilt HTML (not copyrighted image binaries)
        shell: bash
        run: |
          git config user.name 'Atlas media metadata bot'
          git config user.email 'atlas-media@users.noreply.github.com'
          git add data/game_media.json Handheld-Atlas.html
          if git diff --cached --quiet; then echo 'No new game media available'; exit 0; fi
          git commit -m 'data: refresh source-linked game covers and gameplay scenes'
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
